[workspace]
resolver = "2"
members = ["evo_core", "evo_wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# Fast enough physics in dev builds: optimise dependencies, keep our code quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
# Line tables, so a running world can be sampled with gdb to see where a day goes.
debug = 1
