[workspace]
resolver = "2"
members = ["evo_core", "evo_viewer", "evo_wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Fast enough physics in dev builds: optimise dependencies, keep our code quick to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
